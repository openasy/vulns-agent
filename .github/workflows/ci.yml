name: CI

on:
  pull_request:
  push:
    branches: [main, "lts/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: vulns-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 9100:9100 -e VULNS_URL=http://127.0.0.1:1 -e VULNS_INGEST_TOKEN=ci vulns-agent:ci
          for _ in $(seq 1 30); do curl -sf localhost:9100/healthz && break; sleep 1; done
          curl -sf localhost:9100/metrics | grep -q 'openasy_build_info{product="vulns-agent"'
          docker exec -e SYFT_CHECK_FOR_APP_UPDATE=false smoke /usr/local/bin/syft version
          docker logs smoke

  # vulns-agent scans a host for vulns, which matches it with real vulnerability data (ADR 0029).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vulns-agent

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openasy/vulns
          path: vulns

      # vulns-agent and vulns ship with one version (ADR 0019), and main of vulns keeps the last one until its release
      # commit is pushed: give it this version, so the pair is tested as it will ship.
      - name: Give vulns the version of vulns-agent
        run: cd vulns && npm pkg set version="$(node -p 'require("../vulns-agent/package.json").version')"

      - name: Build both images
        run: |
          docker build -t vulns:dev vulns
          docker build -t vulns-agent:dev vulns-agent

      - name: Scan a host and an image, accept a risk, rescan
        run: vulns/e2e/run.sh
